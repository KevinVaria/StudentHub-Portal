<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register - StudentHub</title><link rel="stylesheet" href="style.css"></head><body><header><h1>StudentHub</h1></header><main>
<h1>Student Registration</h1><form method="post" action="register.php">
<label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label>
<label>Mobile<input name="mobile" required></label><label>Password<input name="password" type="password" required></label>
<label>Confirm Password<input name="confirmPassword" type="password" required></label>
<label>Course<select name="course" required><option value="">Select</option><option>BCA</option><option>B.Tech</option><option>BBA</option><option>MCA</option></select></label>
<label>Year<select name="year" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<fieldset><legend>Gender</legend><label><input type="radio" name="gender" value="Male" required>Male</label><label><input type="radio" name="gender" value="Female">Female</label><label><input type="radio" name="gender" value="Other">Other</label></fieldset>
<label><input type="checkbox" name="terms" value="accepted" required> Accept terms</label><button>Register</button></form></main></body></html>
